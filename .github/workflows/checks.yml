name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the skills promise in their compatibility field, and a current release.
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install skills-ref
        # skills-ref requires Python 3.11+; check.sh reports it as skipped when absent.
        if: matrix.python != '3.10'
        run: pip install "skills-ref @ git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
      - name: Run the gates
        # gates.sh, not check.sh: it runs check.sh over a tree holding only what a commit carries,
        # which is the environment a reader installs into, and it is the script a release runs.
        # Running it here means a mistake in it shows up before a release depends on it. Its second
        # gate needs the papers in evals/papers/, which are third-party and not committed, so it
        # reports itself as not run rather than failing.
        run: sh scripts/gates.sh
